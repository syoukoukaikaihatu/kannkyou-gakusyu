<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f2744" />
  <title>Waste Management Executive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">WM</div>
        <div><strong>Waste Management</strong><span>Executive</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <button class="ghost" id="exportBtn">データを書き出す</button>
        <label class="ghost file-btn">データを読み込む<input id="importFile" type="file" accept="application/json" /></label>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div>
          <div class="eyebrow">廃棄物処理業 経営者実務研修・経営ナレッジ</div>
          <h1 id="pageTitle">HOME</h1>
        </div>
        <div class="top-actions"><span class="save-state" id="saveState">自動保存</span></div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
